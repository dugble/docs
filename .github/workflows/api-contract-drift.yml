name: API contract drift

on:
  pull_request:
    paths:
      - "openapi.json"
      - "scripts/check_api_contract_drift.py"
      - ".github/workflows/api-contract-drift.yml"
  push:
    branches:
      - main
    paths:
      - "openapi.json"
      - "scripts/check_api_contract_drift.py"
      - ".github/workflows/api-contract-drift.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs
        uses: actions/checkout@v4

      - name: Check out backend source
        uses: actions/checkout@v4
        with:
          repository: dugble/dugble
          ref: main
          path: backend

      - name: Validate public API route surface
        run: |
          python3 scripts/check_api_contract_drift.py \
            --backend backend \
            --openapi openapi.json
