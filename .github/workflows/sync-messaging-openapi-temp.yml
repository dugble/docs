name: Temporary Messaging OpenAPI sync

on:
  push:
    branches:
      - docs/sync-current-api-contracts

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-current-api-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update and validate OpenAPI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/sync_messaging_openapi.py")
          text = path.read_text()
          text = text.replace(
              '"pattern": "^\\\\+[1-9]\\\\d{7,14}$"',
              '"pattern": "^[+][1-9][0-9]{7,14}$"',
          )
          path.write_text(text)
          PY
          python scripts/sync_messaging_openapi.py
          python -m json.tool openapi.json >/dev/null
      - name: Commit generated OpenAPI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git diff --cached --quiet || git commit -m "docs(api): sync email and SMS contracts"
          git push
