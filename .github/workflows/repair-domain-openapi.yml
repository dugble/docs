name: Repair Sender Domain OpenAPI

on:
  push:
    branches:
      - agent/update-domain-docs

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-domain-docs
      - name: Repair and validate OpenAPI JSON
        run: python scripts/repair_domain_openapi.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git diff --cached --quiet && exit 0
          git commit -m "Update sender domain OpenAPI contract"
          git push origin HEAD:agent/update-domain-docs
