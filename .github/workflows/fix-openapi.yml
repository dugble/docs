name: Repair OpenAPI

on:
  push:
    branches:
      - docs/require-email-from

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/require-email-from
      - name: Repair and validate OpenAPI JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('openapi.json')
          text = path.read_text()
          text = text.replace('"description": "SMS message retrieved successfully."', '"description": "SMS retrieved successfully."')
          text = text.replace('"properties": { "success": { "type": "boolean", "enum": [true] }, "data": { "type": "array", "items": { "$ref": "#/components/schemas/SmsResource" } }\n      },', '"properties": { "success": { "type": "boolean", "enum": [true] }, "data": { "type": "array", "items": { "$ref": "#/components/schemas/SmsResource" } } }\n      },')
          text = text.replace('"SuppressionBatchRemove": { "type": "object", "properties": { "data": { "type": "array", "items": { "$ref": "#/components/schemas/DeleteResponse" } } },', '"SuppressionBatchRemove": { "type": "object", "properties": { "data": { "type": "array", "items": { "$ref": "#/components/schemas/DeleteResponse" } } } },')
          if not text.endswith('\n'):
              text += '\n'
          json.loads(text)
          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git diff --cached --quiet && exit 0
          git commit -m "Repair OpenAPI JSON"
          git push origin HEAD:docs/require-email-from
