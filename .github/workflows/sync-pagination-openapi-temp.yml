name: Temporary Pagination OpenAPI sync

on:
  push:
    branches:
      - docs/sync-current-api-contracts
    paths:
      - scripts/sync_pagination_openapi.py
      - .github/workflows/sync-pagination-openapi-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-current-api-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update and validate OpenAPI
        run: python scripts/sync_pagination_openapi.py
      - name: Commit generated OpenAPI
        run: |
          if git diff --quiet -- openapi.json; then
            echo "No OpenAPI changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "docs(api): sync topics domains templates pagination"
          git push
