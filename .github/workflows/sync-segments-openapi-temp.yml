name: Temporary Segments OpenAPI sync

on:
  push:
    branches:
      - docs/sync-current-api-contracts

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-current-api-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update and validate OpenAPI
        run: |
          python scripts/sync_segments_openapi.py
          python -m json.tool openapi.json >/dev/null
      - name: Commit generated OpenAPI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git diff --cached --quiet || git commit -m "docs(api): sync segment audience and pagination contracts"
          git push
